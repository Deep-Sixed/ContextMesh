name: Release candidate gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python - <<'PY'
          import zipfile
          from pathlib import Path

          def fail(message):
              raise SystemExit(f"::error::{message}")

          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              fail(f"expected one wheel and one sdist, found {wheels} and {sdists}")
          # GRAPH.md ships inside the package. A top-level copy installs loose in
          # site-packages, where another distribution's GRAPH.md can replace it.
          graphs = sorted(n for n in zipfile.ZipFile(wheels[0]).namelist() if n.endswith("GRAPH.md"))
          if graphs != ["contextmesh/GRAPH.md"]:
              fail(f"wheel must carry exactly contextmesh/GRAPH.md, found {graphs}")
          print(wheels[0])
          print(sdists[0])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: contextmesh-dist
          path: dist/*

  core-wheel:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: contextmesh-dist
          path: dist
      - name: Install wheel only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          wheel = next(Path("dist").glob("*.whl"))
          subprocess.check_call([sys.executable, "-m", "pip", "install", str(wheel)])
          PY
      - name: Installed version strings agree
        shell: bash
        run: |
          python - <<'PY'
          from importlib.metadata import version

          import contextmesh
          import contextmesh_mcp

          found = {contextmesh.__version__, contextmesh_mcp.__version__, version("contextmesh-graph")}
          if len(found) != 1:
              raise SystemExit(f"::error::installed version strings disagree: {sorted(found)}")
          print("version", *found)
          PY
      - name: Core has no MCP dependency
        run: python -c "import importlib.util; assert importlib.util.find_spec('mcp') is None"
      - name: Exercise installed CLI
        run: contextmesh --help
      - name: Persist in one process
        run: python -c "from contextmesh_mcp.session import Session; Session.build(rounds=1).save('restart-session')"
      - name: Restore in a fresh process
        run: python -c "from contextmesh_mcp.session import Session; s=Session.load('restart-session'); assert s.generation == 1 and s.describe()['persistent']; print('restart ok')"

  mcp-wheel:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: contextmesh-dist
          path: dist
      - name: Install wheel with MCP extra
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          wheel = next(Path("dist").glob("*.whl")).resolve()
          spec = f"contextmesh-graph[mcp] @ {wheel.as_uri()}"
          subprocess.check_call([sys.executable, "-m", "pip", "install", spec])
          PY
      - name: Exercise installed MCP entry point
        run: contextmesh-mcp --help
      - name: Verify MCP SDK and launcher import
        run: python -c "import mcp, contextmesh_mcp.server; print('mcp extra ok')"
      - name: Build a session through installed MCP launcher
        run: contextmesh-mcp --demo --rounds 1 --save mcp-session
      - name: Restore launcher-created session in a fresh process
        run: contextmesh-mcp --session mcp-session --save restored-session
