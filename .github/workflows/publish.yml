name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and check wheel and sdist
        run: |
          python -m pip install --upgrade pip
          python -m pip install build packaging twine
          python -m build
          python -m twine check dist/*

      # Checked against the built wheel's own metadata rather than pyproject.toml:
      # that is what PyPI receives. Explicit exits, not `assert`, which `python -O`
      # or PYTHONOPTIMIZE would strip.
      - name: Verify release identity
        env:
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          python - <<'PY'
          import os
          import zipfile
          from email.parser import Parser
          from pathlib import Path

          from packaging.utils import canonicalize_name
          from packaging.version import InvalidVersion, Version

          def fail(message):
              raise SystemExit(f"::error::{message}")

          wheels = sorted(Path("dist").glob("*.whl"))
          sdists = sorted(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              fail(f"expected one wheel and one sdist, found {wheels} and {sdists}")
          wheel, sdist = wheels[0], sdists[0]

          with zipfile.ZipFile(wheel) as archive:
              found = [n for n in archive.namelist() if n.endswith(".dist-info/METADATA")]
              if len(found) != 1:
                  fail(f"expected one METADATA file in {wheel.name}, found {found}")
              metadata = Parser().parsestr(archive.read(found[0]).decode("utf-8"))
          name, version = metadata["Name"], Version(metadata["Version"])

          if canonicalize_name(name) != "contextmesh-graph":
              fail(f"built distribution is {name!r}, not contextmesh-graph")
          if os.environ["GITHUB_REF_TYPE"] != "tag":
              fail(f"release ref is a {os.environ['GITHUB_REF_TYPE']}, not a tag")
          tag = os.environ["GITHUB_REF_NAME"]
          try:
              tagged = Version(tag[1:]) if tag.startswith("v") else None
          except InvalidVersion:
              tagged = None
          if tagged != version:
              fail(f"tag {tag} does not name the built version {version}")

          # The release type has to agree with the version, or a GitHub pre-release
          # cut to test the pipeline becomes what `pip install contextmesh-graph` gets.
          prerelease = os.environ["RELEASE_PRERELEASE"] == "true"
          if prerelease and not version.is_prerelease:
              fail(f"GitHub pre-release {tag} carries the final version {version}")
          if version.is_prerelease and not prerelease:
              fail(f"{version} is a pre-release version; mark the GitHub release as one")

          # Filenames carry the normalized version: v1.0.0-rc.1 builds 1.0.0rc1.
          stem = f"contextmesh_graph-{version}"
          if not wheel.name.startswith(f"{stem}-"):
              fail(f"wheel {wheel.name} does not start with {stem}-")
          if sdist.name != f"{stem}.tar.gz":
              fail(f"sdist {sdist.name} is not {stem}.tar.gz")
          print(f"release identity: {name} {version} from {tag}")
          print(wheel)
          print(sdist)
          PY

      - name: Upload release distributions
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish release to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/contextmesh-graph/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
