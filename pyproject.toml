[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "contextmesh-graph"
version = "0.1.0"
description = "A typed context graph for AI agents: provenance, assumptions, and answers that walk a path you can read."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["knowledge-graph", "provenance", "agents", "retrieval", "context"]
dependencies = []

# The MCP SDK needs Python 3.10+ and pulls ~19 packages. The core promises
# 3.9 and zero dependencies, so the server lives behind an extra: installing
# contextmesh never installs mcp, and `contextmesh_mcp.server` is the only
# module that imports it.
[project.optional-dependencies]
mcp = ["mcp>=2"]

[project.urls]
Homepage = "https://github.com/Deep-Sixed/ContextMesh"
Repository = "https://github.com/Deep-Sixed/ContextMesh"
Issues = "https://github.com/Deep-Sixed/ContextMesh/issues"

[project.scripts]
contextmesh = "contextmesh.cli:main"
contextmesh-mcp = "contextmesh_mcp.server:main"

[tool.setuptools]
packages = ["contextmesh", "contextmesh_mcp"]

[tool.setuptools.package-data]
contextmesh = ["../GRAPH.md"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# The corpus is prose. Wrapping a document's sentences mid-clause to satisfy a
# column limit makes the source material harder to read than the limit is worth.
"contextmesh/corpus.py" = ["E501"]
# Provider adapter diagnostics are security/error messages whose exact wording
# is more useful intact than split only to satisfy a display-column limit.
"contextmesh/llm.py" = ["E501"]
# This contract test keeps imports grouped by the authority boundary it tests;
# all functional lint rules still apply.
"tests/test_llm.py" = ["I001"]
